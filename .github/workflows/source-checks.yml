name: MQL source structure and expression checks
on:
  push:
    branches: ["codex/mt5-crt-ea", "main"]
  pull_request:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate source graph and extracted expressions
        run: node CRT_Liquidity_Scalper_Pro/Tests/CheckSources.mjs
